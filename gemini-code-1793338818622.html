<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 3rem;
            color: #ff4d4d;
            margin-bottom: 20px;
        }
        video {
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>你被骗了</h1>

    <!-- 
      autoplay: 尝试自动播放
      muted: 现代浏览器通常要求视频静音才能自动播放
      controls: 显示播放控件
    -->
    <video id="prankVideo" src="67.mp4" autoplay muted controls></video>

    <script>
        // 部分浏览器会阻止自动播放，这里做个兜底，点击页面任意地方即可播放
        document.body.addEventListener('click', function() {
            const video = document.getElementById('prankVideo');
            if (video.paused) {
                video.play();
            }
        });
    </script>

</body>
</html>
